[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-functional-downsizing"
version = "0.1.0"
description = "Reproducible optimization study of functional geography under demographic contraction"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tatsuki Onishi", email = "bougtoir@gmail.com"}]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: optimization tests using processed empirical inputs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
